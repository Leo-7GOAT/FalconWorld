[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falconworld"
version = "0.2.0"
description = "Compact world models for PPO reinforcement learning and CEM-MPC driving research"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "Pillow>=10,<13"]

[project.optional-dependencies]
# Verified RL environment: Windows Python 3.11; CPU wheel uses the official
# extra index configured in setup_rl.ps1. Base legacy modules remain Python 3.10.
rl = ["torch==2.15.0+cpu", "stable-baselines3==2.9.2", "gymnasium==1.4.0"]

[tool.setuptools.packages.find]
include = ["falconworld*"]
